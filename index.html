<style>
  :root{
    --navy:#0B3F71;
    --navy-2:#14507F;
    --light:#F5F6FA;
    --white:#FFFFFF;
    --violet:#7654A0;
    --violet-l:#B5A5CD;
    --blue-l:#9BB4D2;
    --blue-t:#C5D5E8;
    --gray:#64708A;
    --line:#DCE1EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--light);
    font-family:'Archivo', Arial, sans-serif;
    color:var(--navy);
    display:flex;
    flex-direction:column;
  }

  /* ---------- cabecera institucional ---------- */
  header{background:var(--navy);padding:clamp(28px,7vw,44px) clamp(22px,6vw,34px) clamp(20px,5vw,30px);}
  .eyebrow{
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.14em;
    color:var(--blue-l);
    font-size:clamp(12px,3.1vw,14px);
    margin:0 0 10px;
  }
  h1{
    font-size:clamp(30px,8.4vw,40px);
    font-weight:700;line-height:1.1;color:var(--light);
    margin:0;
  }
  .rule{width:92px;height:6px;background:var(--violet);border-radius:3px;margin-top:18px;}
  .wave{display:block;width:100%;height:auto;margin-top:-1px;}

  main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:clamp(24px,6vw,34px) clamp(22px,6vw,28px) 40px;}

  .lead{font-size:clamp(15px,3.8vw,16.5px);line-height:1.5;color:var(--gray);margin:0 0 clamp(22px,5vw,28px);}

  label{
    display:block;
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.12em;
    font-size:clamp(12px,3vw,13px);
    color:var(--violet);
    margin-bottom:9px;
  }
  input[type="text"], select{
    width:100%;
    font-family:'Archivo', Arial, sans-serif;
    font-weight:600;
    font-size:clamp(16px,4.2vw,18px);
    padding:15px 16px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--navy);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus, select:focus{
    border-color:var(--navy);
    box-shadow:0 0 0 4px rgba(11,63,113,.12);
  }
  input[type="text"]::placeholder{color:#98A3B6;font-weight:400;}
  select{
    -webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);
    background-position:calc(100% - 21px) calc(50% + 2px),calc(100% - 15px) calc(50% + 2px);
    background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;
  }
  .hint{font-size:clamp(12.5px,3.1vw,13.5px);color:var(--gray);margin:9px 0 0;}
  .field{margin-top:22px;}

  .go{
    display:block;width:100%;margin-top:26px;
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.12em;
    font-size:clamp(14px,3.6vw,15.5px);
    padding:17px 0;border:none;border-radius:10px;cursor:pointer;
    background:var(--navy);color:var(--light);
    transition:background .15s ease, transform .1s ease;
  }
  .go:hover{background:var(--navy-2);}
  .go:active{transform:scale(.985);}

  .results{margin-top:clamp(24px,6vw,32px);}

  /* ---------- resultado ---------- */
  .mesa-label{
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.2em;
    font-size:clamp(13px,3.3vw,14px);color:var(--gray);
    text-align:center;margin:0 0 12px;
  }
  .mesa-box{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:clamp(18px,5vw,26px) 16px;
    text-align:center;
    animation:rise .3s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .coord{
    margin:14px 0 0;padding:12px 14px;border-radius:12px;
    background:var(--bg-soft,#F2F5F9);border:1px solid var(--line,#DCE3EC);
    font-size:.95rem;font-weight:700;color:var(--ink,#16233A);
  }
  .coord span{
    display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
    font-weight:800;color:var(--muted,#5E6C82);margin-bottom:3px;
  }
  .mesa-number{
    font-size:clamp(76px,22vw,104px);
    font-weight:700;line-height:1;color:var(--navy);
    font-variant-numeric:tabular-nums;
  }
  .persona{
    margin:18px 0 0;text-align:center;
  }
  .persona .nombre{font-size:clamp(16px,4.2vw,18px);font-weight:600;color:var(--navy);}
  .persona .claustro{
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:600;text-transform:uppercase;letter-spacing:.1em;
    font-size:clamp(12px,3vw,13px);color:var(--gray);margin-top:4px;
  }
  .caption{font-size:clamp(13.5px,3.4vw,14.5px);color:var(--gray);text-align:center;margin:16px 0 0;line-height:1.5;}

  .aviso{
    margin-top:18px;
    background:rgba(118,84,160,.07);
    border:1.5px solid var(--line);
    border-left:4px solid var(--violet);
    border-radius:10px;
    padding:14px 16px;
    font-size:clamp(13px,3.3vw,14px);line-height:1.5;color:var(--navy);
  }
  .aviso strong{color:var(--violet);}

  .nota{
    background:var(--white);
    border:1.5px solid var(--line);
    border-left:4px solid var(--violet);
    border-radius:10px;
    padding:14px 16px;
    font-size:clamp(13.5px,3.4vw,14.5px);line-height:1.5;color:var(--navy);
  }
  .nota strong{color:var(--violet);}

  /* ---------- varias coincidencias ---------- */
  .matchlist{display:flex;flex-direction:column;gap:10px;}
  .match-item{
    text-align:left;width:100%;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:13px 15px;
    font-family:'Archivo', Arial, sans-serif;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .match-item:hover{border-color:var(--navy);}
  .match-item:active{transform:scale(.98);}
  .match-name{font-weight:600;font-size:clamp(14.5px,3.7vw,15.5px);color:var(--navy);}
  .match-claustro{
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:600;text-transform:uppercase;letter-spacing:.1em;
    font-size:clamp(11.5px,2.9vw,12.5px);color:var(--gray);margin-top:3px;
  }

  .change-search{
    display:block;width:100%;text-align:center;
    background:none;border:none;cursor:pointer;
    font-family:'Archivo Narrow', 'Arial Narrow', sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.11em;
    font-size:clamp(12.5px,3.1vw,13.5px);color:var(--violet);
    text-decoration:underline;text-underline-offset:3px;
    padding:20px 0 0;
  }

  footer{
    border-top:1px solid var(--line);
    margin:0 clamp(22px,6vw,28px);
    padding:20px 0 30px;
    text-align:center;
    font-size:clamp(11.5px,2.9vw,12.5px);
    line-height:1.5;
    color:var(--gray);
  }
</style>
</head>

/* Clave "al oído": z/s, c/k, b/v, h muda, ll/y, j/g y letras dobles.
   Sirve para que Olivares encuentre a Olivarez, Gomez a Gómes, etc. */
function fonetica(t){
  return t
    .replace(/qu/g, 'k')
    .replace(/c([ei])/g, 's$1')
    .replace(/c/g, 'k')
    .replace(/z/g, 's')
    .replace(/h/g, '')
    .replace(/v/g, 'b')
    .replace(/ll/g, 'y')
    .replace(/y/g, 'i')
    .replace(/j/g, 'g')
    .replace(/(.)\1+/g, '$1');
}

/* ¿Se diferencian en una sola letra? (una sustitución, una de más o una de menos) */
function casiIgual(a, b){
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, fallas = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++fallas > 1) return false;
    if(a.length > b.length) i++;
    else if(b.length > a.length) j++;
    else { i++; j++; }
  }
  return fallas + (a.length - i) + (b.length - j) <= 1;
}

const INDEXED = DATA.map(p => {
  const norm = normalize(p.n);
  return {...p, norm, tokF: norm.split(' ').filter(Boolean).map(fonetica)};
});

const q = document.getElementById('q');
const resultsEl = document.getElementById('results');

/* Hash estable: la misma persona escribiendo lo mismo siempre cae en la misma
   mesa, aunque cierre la página y vuelva a escanear el QR. */
function hash(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

function buscar(raw){
  const n = normalize(raw);
  if(n.length < 2) return { estado:'corto' };
  const tokens = n.split(' ').filter(Boolean);

  // 1) como está escrito
  const m = INDEXED.filter(p => tokens.every(t => p.norm.includes(t)));
  if(m.length === 1) return { estado:'uno', persona: m[0] };
  if(m.length > 1)  return { estado:'varios', personas: m.slice(0, 8) };

  // 2) tolerante a la ortografía, antes de darlo por no inscripto
  const tf = tokens.map(fonetica);
  const aprox = INDEXED.filter(p => tf.every(t =>
    p.tokF.some(function(w){
      // Pido 4 letras y largos parecidos: si no, la "A" de "Oriana A Penayo"
      // matchea con cualquier cosa y la lista se llena de gente que no viene al caso.
      if(w.length < 4 || t.length < 4) return w === t;
      if(Math.abs(w.length - t.length) > 2) return false;
      return w.includes(t) || t.includes(w) || casiIgual(w, t);
    })
  ));
  if(aprox.length) return { estado:'parecidos', personas: aprox.slice(0, 8) };

  return { estado:'ninguno' };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ticket(persona){
  resultsEl.innerHTML = `
    <p class="mesa-label">Mesa</p>
    <div class="mesa-box">
      <div class="mesa-number">${persona.m}</div>
    </div>
    <div class="persona">
      <div class="nombre">${escapeHtml(persona.n.trim())}</div>
      <div class="claustro">${escapeHtml(persona.c)}</div>
    </div>
    <p class="caption">Buscá el cartel con este número en la sala.</p>
    ${COORD[persona.m] ? `<div class="coord"><span>Coordina</span>${escapeHtml(COORD[persona.m])}</div>` : ''}
    <button class="change-search" id="otro">Buscar otro nombre</button>
  `;
  document.getElementById('otro').addEventListener('click', () => {
    q.value = ''; resultsEl.innerHTML = ''; q.focus();
  });
}

function listaCoincidencias(personas, aprox){
  resultsEl.innerHTML = `
    <p class="hint" style="margin:0 0 12px;">${aprox
      ? 'No encontramos ese nombre exacto. ¿Sos alguno de estos?'
      : 'Hay varias coincidencias, tocá tu nombre:'}</p>
    <div class="matchlist">
      ${personas.map((p,i) => `
        <button class="match-item" data-i="${i}">
          <div class="match-name">${escapeHtml(p.n.trim())}</div>
          <div class="match-claustro">${escapeHtml(p.c)}</div>
        </button>`).join('')}
    </div>
  `;
  resultsEl.querySelectorAll('.match-item').forEach(b => {
    b.addEventListener('click', () => ticket(personas[+b.dataset.i], false));
  });
}

function nota(texto){
  resultsEl.innerHTML = `<div class="nota">${texto}</div>`;
}

function resolver(){
  const nombre = q.value.trim();
  if(normalize(nombre).length < 2){
    nota('<strong>Escribí tu apellido</strong> para poder buscarte.');
    q.focus(); return;
  }
  const r = buscar(nombre);
  if(r.estado === 'uno'){ ticket(r.persona); return; }
  if(r.estado === 'varios'){ listaCoincidencias(r.personas, false); return; }
  if(r.estado === 'parecidos'){ listaCoincidencias(r.personas, true); return; }

  nota('<strong>No figurás en la lista de inscriptos.</strong><br>'
     + 'Probá escribiendo solo el apellido, por si está cargado distinto. '
     + 'Si tampoco aparece, acercate a la mesa de acreditación o buscá a un coordinador del taller: '
     + 'ellos te asignan la mesa.');
}

document.getElementById('goBtn').addEventListener('click', resolver);
q.addEventListener('keydown', e => { if(e.key === 'Enter') resolver(); });
</script>
</body>
</html>
